name: upa_break
description: "Upa Break - nhắc giãn cơ cho dân văn phòng, cùng Upa - kỳ nhông văn phòng đội nón lá."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  android_intent_plus: ^6.1.0
  device_info_plus: ^13.3.0
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  generate: true   # gen-l10n: lib/l10n/*.arb -> AppLocalizations
  assets:
    - assets/mascot/
    - assets/mascot/rig/

# Icon app: nguồn sinh từ tool/gen_mascot.py -> `python3 tool/render_mascot.py --icons`,
# rồi `fvm dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/icon/icon_full.png"   # iOS + Android < 8: nền tràn viền, không alpha
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"   # themed icon Android 13+
  adaptive_icon_foreground_inset: 0   # foreground đã canh sẵn trong vùng an toàn 66dp

# Splash: nền kem, mặt Upa ở giữa. Chạy `fvm dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFF8F0"
  image: assets/icon/splash.png
  android_12:
    color: "#FFF8F0"
    image: assets/icon/splash_android12.png
  android: true
  ios: true
  web: false
