publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
